openapi: '3.0.0'
info:
  title: Nevera Inteligente API
  description: API RESTful con arquitectura jerárquica, validaciones en tiempo real, restricciones de integridad y respuestas unificadas.
  version: '1.0.0'
servers:
  - url: https://nevera-inteligente-api.onrender.com
    description: Servidor de producción en Render (Nube)

paths:
  # ==========================================
  # 1. MÓDULO DE USUARIOS
  # ==========================================
  /api/usuarios:
    post:
      tags:
        - Usuarios
      operationId: createUser
      summary: Crear un nuevo usuario (Valida unicidad, ID numérico y contraseña segura)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        "200":
          description: Resultado de la validación y registro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Usuarios
      operationId: listUsers
      summary: Listar o filtrar usuarios por ID, nombre o correo
      parameters:
        - name: busqueda
          in: query
          required: false
          schema:
            type: string
          description: Texto para filtrar usuarios por ID, nombre o correo (devuelve aviso si no hay coincidencias)
      responses:
        "200":
          description: Lista obtenida o mensaje de sin coincidencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/usuarios/{id}:
    get:
      tags:
        - Usuarios
      operationId: getUserById
      summary: Consultar un usuario individual por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario encontrado o mensaje de no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags:
        - Usuarios
      operationId: updateUser
      summary: Actualizar un usuario (Nombre, correo o contraseña con validación de seguridad)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        "200":
          description: Actualizado exitosamente o rechazo por seguridad/duplicidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Usuarios
      operationId: deleteUser
      summary: Eliminar un usuario y sus datos conectados en cascada (conservando historial)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado exitosamente o usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 2. MÓDULO DE CATEGORÍAS
  # ==========================================
  /api/categorias:
    post:
      tags:
        - Categorías
      operationId: createCategory
      summary: Crear una nueva categoría de alimentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        "200":
          description: Creada exitosamente o error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Categorías
      operationId: listCategories
      summary: Listar categorías
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/categorias/{id}:
    get:
      tags:
        - Categorías
      operationId: getCategoryById
      summary: Consultar categoría individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenida exitosamente o no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Categorías
      operationId: deleteCategory
      summary: Eliminar categoría (Bloqueada si tiene productos asociados)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminada exitosamente o restricción de integridad aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 3. MÓDULO DE MARCAS
  # ==========================================
  /api/marcas:
    post:
      tags:
        - Marcas
      operationId: createBrand
      summary: Crear una nueva marca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaInput'
      responses:
        "200":
          description: Creada exitosamente o error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Marcas
      operationId: listBrands
      summary: Listar marcas
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/marcas/{id}:
    get:
      tags:
        - Marcas
      operationId: getBrandById
      summary: Consultar marca individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenida exitosamente o no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Marcas
      operationId: deleteBrand
      summary: Eliminar marca (Bloqueada si tiene productos asociados)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminada exitosamente o restricción de integridad aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 4. MÓDULO DE UNIDADES DE MEDIDA
  # ==========================================
  /api/unidades_medida:
    post:
      tags:
        - Unidades de Medida
      operationId: createUnit
      summary: Crear una nueva unidad de medida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadMedidaInput'
      responses:
        "200":
          description: Creada exitosamente o error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Unidades de Medida
      operationId: listUnits
      summary: Listar unidades de medida
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/unidades_medida/{id}:
    get:
      tags:
        - Unidades de Medida
      operationId: getUnitById
      summary: Consultar unidad de medida individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenida exitosamente o no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Unidades de Medida
      operationId: deleteUnit
      summary: Eliminar unidad (Bloqueada si está en uso en el inventario)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminada exitosamente o restricción de integridad aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 5. MÓDULO DE INGREDIENTES
  # ==========================================
  /api/ingredientes:
    post:
      tags:
        - Ingredientes
      operationId: createIngredient
      summary: Crear un nuevo ingrediente base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredienteInput'
      responses:
        "200":
          description: Creado exitosamente o error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Ingredientes
      operationId: listIngredients
      summary: Listar ingredientes
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/ingredientes/{id}:
    get:
      tags:
        - Ingredientes
      operationId: getIngredientById
      summary: Consultar ingrediente individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Ingredientes
      operationId: deleteIngredient
      summary: Eliminar ingrediente (Bloqueado si está en un Meal Prep)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado exitosamente o restricción de integridad aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 6. MÓDULO DE PRODUCTOS
  # ==========================================
  /api/productos:
    post:
      tags:
        - Productos
      operationId: createProduct
      summary: Crear un nuevo producto comercial (Valida marca y categoría existentes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        "200":
          description: Creado exitosamente o error de referencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Productos
      operationId: listProducts
      summary: Listar productos con detalle de marca y categoría
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/productos/{id}:
    get:
      tags:
        - Productos
      operationId: getProductById
      summary: Consultar producto individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Productos
      operationId: deleteProduct
      summary: Eliminar producto (Bloqueado si está en el inventario)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado exitosamente o restricción de integridad aplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 7. MÓDULO DE INVENTARIO
  # ==========================================
  /api/inventario:
    post:
      tags:
        - Inventario
      operationId: addInventoryItem
      summary: Agregar alimento a la nevera o acumular cantidad si ya existe activo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "200":
          description: Agregado o acumulado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Inventario
      operationId: listInventoryItems
      summary: Listar inventario (Filtrable por usuario y nevera)
      parameters:
        - name: user_nombre
          in: query
          required: false
          schema:
            type: string
        - name: nevera_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/inventario/{itemId}:
    get:
      tags:
        - Inventario
      operationId: getInventoryItem
      summary: Consultar detalle de un alimento por ID
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags:
        - Inventario
      operationId: updateInventoryItem
      summary: Actualizar alimento del inventario y registrar en historial
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "200":
          description: Actualizado exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Inventario
      operationId: deleteInventoryItem
      summary: Eliminar alimento del inventario y guardar snapshot en historial
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 8. MÓDULO DE HISTORIAL DE INVENTARIO
  # ==========================================
  /api/historial_inventario:
    get:
      tags:
        - Historial de Inventario
      operationId: listInventoryHistory
      summary: Listar bitácora de cambios con respaldo (snapshot)
      responses:
        "200":
          description: Historial obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/historial_inventario/{id}:
    get:
      tags:
        - Historial de Inventario
      operationId: getHistoryById
      summary: Consultar registro individual del historial por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 9. MÓDULO DE PATRONES PREDICTIVOS
  # ==========================================
  /api/patrones_predictivos:
    post:
      tags:
        - Patrones Predictivos
      operationId: createPredictivePattern
      summary: Crear un patrón predictivo de consumo (Valida usuario existente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatronPredictivoInput'
      responses:
        "200":
          description: Creado exitosamente o error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Patrones Predictivos
      operationId: getPredictivePatterns
      summary: Obtener patrones predictivos (Filtrable por usuario)
      parameters:
        - name: user_nombre
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Obtenidos exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/patrones_predictivos/{id}:
    get:
      tags:
        - Patrones Predictivos
      operationId: getPredictivePatternById
      summary: Consultar patrón predictivo individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 10. MÓDULO DE PLANES DE COMIDA (MEAL PREPS)
  # ==========================================
  /api/meal_preps:
    post:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: createMealPrep
      summary: Crear plan de comida (Valida patrón predictivo, ingrediente y unicidad del patrón)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPrepInput'
      responses:
        "200":
          description: Creado exitosamente o error de validación/duplicidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: listMealPreps
      summary: Listar planes de comida
      responses:
        "200":
          description: Listado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/meal_preps/{id}:
    get:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: getMealPrepById
      summary: Consultar plan de comida individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: deleteMealPrep
      summary: Eliminar plan de comida por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado exitosamente o no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 11. MÓDULO DE NOTIFICACIONES
  # ==========================================
  /api/notificaciones:
    post:
      tags:
        - Notificaciones
      operationId: createNotification
      summary: Crear notificación para un usuario existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacionInput'
      responses:
        "200":
          description: Creada exitosamente o error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Notificaciones
      operationId: listNotifications
      summary: Listar notificaciones (Filtrable por usuario)
      parameters:
        - name: user_nombre
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Obtenidas exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/notificaciones/{id}:
    get:
      tags:
        - Notificaciones
      operationId: getNotificationById
      summary: Consultar notificación individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenida exitosamente o no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Notificaciones
      operationId: deleteNotification
      summary: Eliminar notificación por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminada exitosamente o no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true

    UsuarioInput:
      type: object
      properties:
        id:
          type: string
          description: ID numérico del usuario
        nombre:
          type: string
          description: Nombre único
        email:
          type: string
          format: email
        password_hash:
          type: string
          description: Mínimo 12 caracteres, mayúsculas, minúsculas, números y símbolos

    CategoriaInput:
      type: object
      properties:
        _id:
          type: string

    MarcaInput:
      type: object
      properties:
        _id:
          type: string

    UnidadMedidaInput:
      type: object
      properties:
        _id:
          type: string
        abreviatura:
          type: string

    IngredienteInput:
      type: object
      properties:
        _id:
          type: string

    ProductoInput:
      type: object
      properties:
        _id:
          type: string
        marca_nombre:
          type: string
        categoria_nombre:
          type: string
        nombre:
          type: string

    InventarioInput:
      type: object
      properties:
        user_nombre:
          type: string
        nevera_id:
          type: string
        producto_id:
          type: string
        unidad_medida_nombre:
          type: string
        cantidad:
          type: number
        fecha_vencimiento:
          type: string
          format: date-time
          nullable: true
        estado:
          type: string
          enum:
            - EN_NEVERA
            - CONSUMIDO
            - DESPERDICIADO
          default: EN_NEVERA

    PatronPredictivoInput:
      type: object
      properties:
        _id:
          type: string
        user_nombre:
          type: string
        frecuencia_compra_dias:
          type: number
        probabilidad_desperdicio:
          type: number

    MealPrepInput:
      type: object
      properties:
        patron_predictivo_id:
          type: string
          description: ID del patrón predictivo (FK, único por plan)
        ingrediente_nombre:
          type: string
          description: Nombre del ingrediente base (FK)
        nombre_receta:
          type: string

    NotificacionInput:
      type: object
      properties:
        user_nombre:
          type: string
        mensaje:
          type: string
        tipo:
          type: string
          enum:
            - VENCIMIENTO
            - STOCK_BAJO
            - SUGERENCIA
          default: SUGERENCIA
        leida:
          type: boolean
          default: false