openapi: '3.0.0'
info:
  title: Nevera Inteligente API
  description: API RESTful con arquitectura en árbol jerárquico, claves naturales y organización por entidades.
  version: '1.0.0'
servers:
  - url: https://nevera-inteligente-api.onrender.com
    description: Servidor de producción en Render (Nube)

paths:
  # ==========================================
  # 1. MÓDULO DE USUARIOS
  # ==========================================
  /api/usuarios:
    post:
      tags:
        - Usuarios
      operationId: createUser
      summary: Crear un nuevo usuario (Nombre como PK)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      tags:
        - Usuarios
      operationId: listUsers
      summary: Listar usuarios
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/usuarios/{id}:
    delete:
      tags:
        - Usuarios
      operationId: deleteUser
      summary: Eliminar un usuario por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "404":
          description: Usuario no encontrado
        "500":
          description: Error del servidor

  # ==========================================
  # 2. MÓDULO DE CATEGORÍAS
  # ==========================================
  /api/categorias:
    post:
      tags:
        - Categorías
      operationId: createCategory
      summary: Crear una nueva categoría de alimentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      tags:
        - Categorías
      operationId: listCategories
      summary: Listar categorías
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  # ==========================================
  # 3. MÓDULO DE MARCAS
  # ==========================================
  /api/marcas:
    post:
      tags:
        - Marcas
      operationId: createBrand
      summary: Crear una nueva marca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      tags:
        - Marcas
      operationId: listBrands
      summary: Listar marcas
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/marcas/{id}:
    delete:
      tags:
        - Marcas
      operationId: deleteBrand
      summary: Eliminar una marca por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marca eliminada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "404":
          description: Marca no encontrada
        "500":
          description: Error del servidor

  # ==========================================
  # 4. MÓDULO DE UNIDADES DE MEDIDA
  # ==========================================
  /api/unidades_medida:
    post:
      tags:
        - Unidades de Medida
      operationId: createUnit
      summary: Crear una nueva unidad de medida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadMedidaInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      tags:
        - Unidades de Medida
      operationId: listUnits
      summary: Listar unidades de medida
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  # ==========================================
  # 5. MÓDULO DE INGREDIENTES
  # ==========================================
  /api/ingredientes:
    post:
      tags:
        - Ingredientes
      operationId: createIngredient
      summary: Crear un nuevo ingrediente base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredienteInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      tags:
        - Ingredientes
      operationId: listIngredients
      summary: Listar ingredientes
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/ingredientes/{id}:
    delete:
      tags:
        - Ingredientes
      operationId: deleteIngredient
      summary: Eliminar un ingrediente por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ingrediente eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "404":
          description: Ingrediente no encontrado
        "500":
          description: Error del servidor

  # ==========================================
  # 6. MÓDULO DE PRODUCTOS
  # ==========================================
  /api/productos:
    post:
      tags:
        - Productos
      operationId: createProduct
      summary: Crear un nuevo producto comercial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Error en datos o llaves foráneas
        "500":
          description: Error del servidor
    get:
      tags:
        - Productos
      operationId: listProducts
      summary: Listar productos
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/productos/{id}:
    delete:
      tags:
        - Productos
      operationId: deleteProduct
      summary: Eliminar un producto por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Producto eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "404":
          description: Producto no encontrado
        "500":
          description: Error del servidor

  # ==========================================
  # 7. MÓDULO DE INVENTARIO
  # ==========================================
  /api/inventario:
    post:
      tags:
        - Inventario
      operationId: addInventoryItem
      summary: Agregar alimento físico a la nevera (Genera historial automático)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "201":
          description: Alimento agregado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos no válidos
        "500":
          description: Error del servidor
    get:
      tags:
        - Inventario
      operationId: listInventoryItems
      summary: Listar alimentos en inventario (opcionalmente filtrado por nevera_id)
      parameters:
        - name: nevera_id
          in: query
          required: false
          schema:
            type: string
          description: Filtrar por ID de nevera específica
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/inventario/{itemId}:
    get:
      tags:
        - Inventario
      operationId: getInventoryItem
      summary: Obtener detalle de un alimento por ID
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "404":
          description: No encontrado
        "500":
          description: Error del servidor
    put:
      tags:
        - Inventario
      operationId: updateInventoryItem
      summary: Actualizar estado o cantidad (Genera historial automático)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "200":
          description: Actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "404":
          description: No encontrado
        "500":
          description: Error del servidor
    delete:
      tags:
        - Inventario
      operationId: deleteInventoryItem
      summary: Eliminar alimento del inventario (Genera historial automático)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "404":
          description: No encontrado
        "500":
          description: Error del servidor

  # ==========================================
  # 8. MÓDULO DE HISTORIAL DE INVENTARIO
  # ==========================================
  /api/historial_inventario:
    get:
      tags:
        - Historial de Inventario
      operationId: listInventoryHistory
      summary: Consultar el historial de cambios del inventario
      responses:
        "200":
          description: Historial obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  # ==========================================
  # 9. MÓDULO DE PATRONES PREDICTIVOS
  # ==========================================
  /api/patrones_predictivos:
    post:
      tags:
        - Patrones Predictivos
      operationId: createPredictivePattern
      summary: Crear un nuevo patrón predictivo de consumo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatronPredictivoInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos no válidos
        "500":
          description: Error del servidor
    get:
      tags:
        - Patrones Predictivos
      operationId: getPredictivePatterns
      summary: Obtener patrones predictivos de consumo
      responses:
        "200":
          description: Obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  # ==========================================
  # 10. MÓDULO DE PLANES DE COMIDA (MEAL PREPS)
  # ==========================================
  /api/meal_preps:
    post:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: createMealPrep
      summary: Crear plan de comidas vinculado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPrepInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos no válidos
        "500":
          description: Error del servidor
    get:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: listMealPreps
      summary: Listar planes de comida
      responses:
        "200":
          description: Listado obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true

    UsuarioInput:
      type: object
      properties:
        id:
          type: string
          description: Identificador único del usuario (PK)
        nombre:
          type: string
          description: Nombre del usuario
        email:
          type: string
          format: email
        password_hash:
          type: string

    CategoriaInput:
      type: object
      properties:
        _id:
          type: string
          description: Nombre de la categoría (Clave Primaria natural)

    MarcaInput:
      type: object
      properties:
        _id:
          type: string
          description: Nombre de la marca (Clave Primaria natural)

    UnidadMedidaInput:
      type: object
      properties:
        _id:
          type: string
          description: Nombre de la unidad (Clave Primaria natural)
        abreviatura:
          type: string
          description: Símbolo abreviado (Ej. g, ml, und)

    IngredienteInput:
      type: object
      properties:
        _id:
          type: string
          description: Nombre del ingrediente base (Clave Primaria natural)

    ProductoInput:
      type: object
      properties:
        _id:
          type: string
          description: Código personalizado del producto (Ej. 101)
        marca_nombre:
          type: string
          description: Nombre o ID de la marca (FK)
        categoria_nombre:
          type: string
          description: Nombre o ID de la categoría (FK)
        nombre:
          type: string
          description: Nombre específico del producto

    InventarioInput:
      type: object
      properties:
        user_nombre:
          type: string
          description: ID del usuario dueño (FK)
        nevera_id:
          type: string
          description: Identificador de la nevera (Ej. NEVERA-01, NEVERA-FINCA)
        producto_id:
          type: string
          description: Código personalizado del producto (Ej. 101)
        unidad_medida_nombre:
          type: string
          description: Nombre de la unidad de medida (FK)
        cantidad:
          type: number
        fecha_vencimiento:
          type: string
          format: date-time
          nullable: true
        estado:
          type: string
          enum:
            - EN_NEVERA
            - CONSUMIDO
            - DESPERDICIADO
          default: EN_NEVERA

    PatronPredictivoInput:
      type: object
      properties:
        _id:
          type: string
          description: Código personalizado del patrón (Ej. 1)
        user_nombre:
          type: string
          description: ID del usuario evaluado (FK)
        frecuencia_compra_dias:
          type: number
          description: Frecuencia estimada de compra en días
        probabilidad_desperdicio:
          type: number
          description: Índice de probabilidad de desperdicio

    MealPrepInput:
      type: object
      properties:
        patron_predictivo_id:
          type: string
          description: Código del patrón predictivo (Ej. 1)
        ingrediente_nombre:
          type: string
          description: Nombre del ingrediente base (FK)
        nombre_receta:
          type: string