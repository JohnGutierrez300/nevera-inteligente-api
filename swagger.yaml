openapi: '3.0.0'
info:
  title: Nevera Inteligente API
  description: API RESTful con arquitectura jerárquica, validaciones en tiempo real y respuestas unificadas.
  version: '1.0.0'
servers:
- url: https://nevera-inteligente-api.onrender.com
  description: Servidor de producción en Render (Nube)

paths:
  # ==========================================
  # 1. MÓDULO DE USUARIOS
  # ==========================================
  /api/usuarios:
    post:
      tags:
        - Usuarios
      operationId: createUser
      summary: Crear un nuevo usuario (Valida unicidad y existencia en tiempo real)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        "200":
          description: Resultado de la validación y registro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Usuarios
      operationId: listUsers
      summary: Listar o buscar usuarios en tiempo real por nombre o correo
      parameters:
        - name: busqueda
          in: query
          required: false
          schema:
            type: string
          description: Texto para filtrar usuarios en tiempo real
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/usuarios/{id}:
    get:
      tags:
        - Usuarios
      operationId: getUserById
      summary: Consultar un usuario individual por su ID (Validación en tiempo real)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario encontrado o mensaje de error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags:
        - Usuarios
      operationId: updateUser
      summary: Actualizar un usuario validando duplicados en tiempo real
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        "200":
          description: Actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Usuarios
      operationId: deleteUser
      summary: Eliminar un usuario y sus datos conectados
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 2. MÓDULO DE CATEGORÍAS
  # ==========================================
  /api/categorias:
    post:
      tags:
        - Categorías
      operationId: createCategory
      summary: Crear categoría validando existencia previa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        "200":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Categorías
      operationId: listCategories
      summary: Listar categorías
      responses:
        "200":
          description: Lista obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/categorias/{id}:
    get:
      tags:
        - Categorías
      operationId: getCategoryById
      summary: Consultar categoría individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Categorías
      operationId: deleteCategory
      summary: Eliminar categoría (Protegida por integridad)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resultado de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 3. MÓDULO DE MARCAS
  # ==========================================
  /api/marcas:
    post:
      tags:
        - Marcas
      operationId: createBrand
      summary: Crear marca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaInput'
      responses:
        "200":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Marcas
      operationId: listBrands
      summary: Listar marcas
      responses:
        "200":
          description: Lista obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/marcas/{id}:
    get:
      tags:
        - Marcas
      operationId: getBrandById
      summary: Consultar marca individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Marcas
      operationId: deleteBrand
      summary: Eliminar marca
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 4. MÓDULO DE UNIDADES DE MEDIDA
  # ==========================================
  /api/unidades_medida:
    post:
      tags:
        - Unidades de Medida
      operationId: createUnit
      summary: Crear unidad de medida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadMedidaInput'
      responses:
        "200":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Unidades de Medida
      operationId: listUnits
      summary: Listar unidades
      responses:
        "200":
          description: Lista obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/unidades_medida/{id}:
    get:
      tags:
        - Unidades de Medida
      operationId: getUnitById
      summary: Consultar unidad individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Unidades de Medida
      operationId: deleteUnit
      summary: Eliminar unidad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 5. MÓDULO DE INGREDIENTES
  # ==========================================
  /api/ingredientes:
    post:
      tags:
        - Ingredientes
      operationId: createIngredient
      summary: Crear ingrediente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredienteInput'
      responses:
        "200":
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Ingredientes
      operationId: listIngredients
      summary: Listar ingredientes
      responses:
        "200":
          description: Lista obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/ingredientes/{id}:
    get:
      tags:
        - Ingredientes
      operationId: getIngredientById
      summary: Consultar ingrediente individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Ingredientes
      operationId: deleteIngredient
      summary: Eliminar ingrediente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 6. MÓDULO DE PRODUCTOS
  # ==========================================
  /api/productos:
    post:
      tags:
        - Productos
      operationId: createProduct
      summary: Crear producto validando referencias en tiempo real
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        "200":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Productos
      operationId: listProducts
      summary: Listar productos
      responses:
        "200":
          description: Lista obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/productos/{id}:
    get:
      tags:
        - Productos
      operationId: getProductById
      summary: Consultar producto individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Productos
      operationId: deleteProduct
      summary: Eliminar producto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 7. MÓDULO DE INVENTARIO
  # ==========================================
  /api/inventario:
    post:
      tags:
        - Inventario
      operationId: addInventoryItem
      summary: Agregar alimento validando usuario y producto en tiempo real (con acumulación inteligente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "200":
          description: Agregado o actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Inventario
      operationId: listInventoryItems
      summary: Listar inventario (Filtrable en tiempo real por usuario y nevera)
      parameters:
        - name: user_nombre
          in: query
          required: false
          schema:
            type: string
        - name: nevera_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Filtrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/inventario/{itemId}:
    get:
      tags:
        - Inventario
      operationId: getInventoryItem
      summary: Consultar detalle de un alimento por ID
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags:
        - Inventario
      operationId: updateInventoryItem
      summary: Actualizar inventario
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Inventario
      operationId: deleteInventoryItem
      summary: Eliminar del inventario
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 8. MÓDULO DE HISTORIAL DE INVENTARIO
  # ==========================================
  /api/historial_inventario:
    get:
      tags:
        - Historial de Inventario
      operationId: listInventoryHistory
      summary: Listar bitácora de cambios
      responses:
        "200":
          description: Historial obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/historial_inventario/{id}:
    get:
      tags:
        - Historial de Inventario
      operationId: getHistoryById
      summary: Consultar historial individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 9. MÓDULO DE PATRONES PREDICTIVOS
  # ==========================================
  /api/patrones_predictivos:
    post:
      tags:
        - Patrones Predictivos
      operationId: createPredictivePattern
      summary: Crear patrón predictivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatronPredictivoInput'
      responses:
        "200":
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Patrones Predictivos
      operationId: getPredictivePatterns
      summary: Obtener patrones
      parameters:
        - name: user_nombre
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/patrones_predictivos/{id}:
    get:
      tags:
        - Patrones Predictivos
      operationId: getPredictivePatternById
      summary: Consultar patrón individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 10. MÓDULO DE PLANES DE COMIDA (MEAL PREPS)
  # ==========================================
  /api/meal_preps:
    post:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: createMealPrep
      summary: Crear plan de comida validando llaves foráneas en tiempo real
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPrepInput'
      responses:
        "200":
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: listMealPreps
      summary: Listar planes
      responses:
        "200":
          description: Listado obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/meal_preps/{id}:
    get:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: getMealPrepById
      summary: Consultar plan individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Planes de Comida (Meal Preps)
      operationId: deleteMealPrep
      summary: Eliminar plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==========================================
  # 11. MÓDULO DE NOTIFICACIONES
  # ==========================================
  /api/notificaciones:
    post:
      tags:
        - Notificaciones
      operationId: createNotification
      summary: Crear notificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacionInput'
      responses:
        "200":
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags:
        - Notificaciones
      operationId: listNotifications
      summary: Listar notificaciones
      parameters:
        - name: user_nombre
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Obtenidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/notificaciones/{id}:
    get:
      tags:
        - Notificaciones
      operationId: getNotificationById
      summary: Consultar notificación individual por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Obtenida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags:
        - Notificaciones
      operationId: deleteNotification
      summary: Eliminar notificación
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true

    UsuarioInput:
      type: object
      properties:
        id:
          type: string
          description: ID numérico del usuario
        nombre:
          type: string
          description: Nombre único
        email:
          type: string
          format: email
        password_hash:
          type: string

    CategoriaInput:
      type: object
      properties:
        _id:
          type: string

    MarcaInput:
      type: object
      properties:
        _id:
          type: string

    UnidadMedidaInput:
      type: object
      properties:
        _id:
          type: string
        abreviatura:
          type: string

    IngredienteInput:
      type: object
      properties:
        _id:
          type: string

    ProductoInput:
      type: object
      properties:
        _id:
          type: string
        marca_nombre:
          type: string
        categoria_nombre:
          type: string
        nombre:
          type: string

    InventarioInput:
      type: object
      properties:
        user_nombre:
          type: string
        nevera_id:
          type: string
        producto_id:
          type: string
        unidad_medida_nombre:
          type: string
        cantidad:
          type: number
        fecha_vencimiento:
          type: string
          format: date-time
          nullable: true
        estado:
          type: string
          enum:
            - EN_NEVERA
            - CONSUMIDO
            - DESPERDICIADO
          default: EN_NEVERA

    PatronPredictivoInput:
      type: object
      properties:
        _id:
          type: string
        user_nombre:
          type: string
        frecuencia_compra_dias:
          type: number
        probabilidad_desperdicio:
          type: number

    MealPrepInput:
      type: object
      properties:
        patron_predictivo_id:
          type: string
          description: ID del patrón predictivo (FK)
        ingrediente_nombre:
          type: string
          description: Nombre del ingrediente base (FK)
        nombre_receta:
          type: string

    NotificacionInput:
      type: object
      properties:
        user_nombre:
          type: string
        mensaje:
          type: string
        tipo:
          type: string
          enum:
            - VENCIMIENTO
            - STOCK_BAJO
            - SUGERENCIA
          default: SUGERENCIA
        leida:
          type: boolean
          default: false