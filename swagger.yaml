openapi: '3.0.0'
info:
  title: Nevera Inteligente API
  description: API RESTful con arquitectura en árbol jerárquico unidireccional y claves naturales, manejo estricto de códigos HTTP y claves foráneas.
  version: '1.0.0'
servers:
  - url: https://nevera-inteligente-api.onrender.com
    description: Servidor de producción en Render (Nube)
paths:
  /api/usuarios:
    post:
      operationId: createUser
      summary: Crear un nuevo usuario (Nombre como PK)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        "201":
          description: Creado exitosamente (2xx - Satisfactoria)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Solicitud incorrecta o datos incompletos (4xx - Error del cliente)
        "500":
          description: Error interno del servidor (5xx - Error del servidor)
    get:
      operationId: listUsers
      summary: Listar usuarios
      responses:
        "200":
          description: Lista obtenida exitosamente (2xx - Satisfactoria)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error interno del servidor (5xx - Error del servidor)

  /api/categorias:
    post:
      operationId: createCategory
      summary: Crear una nueva categoría de alimentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      operationId: listCategories
      summary: Listar categorías
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/marcas:
    post:
      operationId: createBrand
      summary: Crear una nueva marca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      operationId: listBrands
      summary: Listar marcas
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/unidades_medida:
    post:
      operationId: createUnit
      summary: Crear una nueva unidad de medida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadMedidaInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      operationId: listUnits
      summary: Listar unidades de medida
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/ingredientes:
    post:
      operationId: createIngredient
      summary: Crear un nuevo ingrediente base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredienteInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos
        "500":
          description: Error del servidor
    get:
      operationId: listIngredients
      summary: Listar ingredientes
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/productos:
    post:
      operationId: createProduct
      summary: Crear un nuevo producto comercial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        "201":
          description: Creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Error en datos o llaves foráneas
        "500":
          description: Error del servidor
    get:
      operationId: listProducts
      summary: Listar productos
      responses:
        "200":
          description: Lista obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor

  /api/inventario:
    post:
      operationId: addInventoryItem
      summary: Agregar alimento físico a la nevera (Genera historial automático)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "201":
          description: Alimento agregado exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos de entrada no válidos (4xx - Cliente)
        "500":
          description: Error interno del servidor (5xx - Servidor)
    get:
      operationId: listInventoryItems
      summary: Listar alimentos en inventario
      responses:
        "200":
          description: Lista obtenida exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error interno del servidor (5xx)

  /api/inventario/{itemId}:
    get:
      operationId: getInventoryItem
      summary: Obtener detalle de un alimento por ID
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle obtenido exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "404":
          description: Recurso no encontrado (4xx - Cliente)
        "500":
          description: Error interno del servidor (5xx)
    put:
      operationId: updateInventoryItem
      summary: Actualizar estado o cantidad (Genera historial automático)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "200":
          description: Actualizado exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos inválidos (4xx)
        "404":
          description: Recurso no encontrado (4xx)
        "500":
          description: Error interno del servidor (5xx)
    delete:
      operationId: deleteInventoryItem
      summary: Eliminar alimento del inventario (Genera historial automático)
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Eliminado exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "404":
          description: Recurso no encontrado (4xx)
        "500":
          description: Error interno del servidor (5xx)

  /api/historial_inventario:
    get:
      operationId: listInventoryHistory
      summary: Consultar el historial de cambios del inventario
      responses:
        "200":
          description: Historial obtenido exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error interno del servidor (5xx)

  /api/patrones_predictivos:
    post:
      operationId: createPredictivePattern
      summary: Crear un nuevo patrón predictivo de consumo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatronPredictivoInput'
      responses:
        "201":
          description: Creado exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos no válidos (4xx)
        "500":
          description: Error del servidor (5xx)
    get:
      operationId: getPredictivePatterns
      summary: Obtener patrones predictivos de consumo
      responses:
        "200":
          description: Obtenido exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor (5xx)

  /api/meal_preps:
    post:
      operationId: createMealPrep
      summary: Crear plan de comidas vinculado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPrepInput'
      responses:
        "201":
          description: Creado exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          description: Datos no válidos (4xx)
        "500":
          description: Error del servidor (5xx)
    get:
      operationId: listMealPreps
      summary: Listar planes de comida
      responses:
        "200":
          description: Listado obtenido exitosamente (2xx)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          description: Error del servidor (5xx)

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          nullable: true

    UsuarioInput:
      type: object
      properties:
        nombre:
          type: string
          description: Nombre del usuario (Actúa como Clave Primaria)
        email:
          type: string
          format: email
        password_hash:
          type: string

    CategoriaInput:
      type: object
      properties:
        _id:
          type: string
          description: Nombre de la categoría (Clave Primaria natural)

    MarcaInput:
      type: object
      properties:
        _id:
          type: string
          description: Nombre de la marca (Clave Primaria natural)

    UnidadMedidaInput:
      type: object
      properties:
        _id:
          type: string
          description: Nombre de la unidad (Clave Primaria natural)
        abreviatura:
          type: string
          description: Símbolo abreviado (Ej. g, ml, und)

    IngredienteInput:
      type: object
      properties:
        _id:
          type: string
          description: Nombre del ingrediente base (Clave Primaria natural)

    ProductoInput:
      type: object
      properties:
        _id:
          type: string
          description: Código personalizado del producto (Ej. P-01)
        marca_nombre:
          type: string
          description: Nombre de la marca (FK)
        categoria_nombre:
          type: string
          description: Nombre de la categoría (FK)
        nombre:
          type: string
          description: Nombre específico del producto

    InventarioInput:
      type: object
      properties:
        user_nombre:
          type: string
          description: Nombre del usuario dueño (FK)
        producto_id:
          type: string
          description: Código personalizado del producto (Ej. P-01)
        unidad_medida_nombre:
          type: string
          description: Nombre de la unidad de medida (FK)
        cantidad:
          type: number
        fecha_vencimiento:
          type: string
          format: date-time
          nullable: true
        estado:
          type: string
          enum:
            - EN_NEVERA
            - CONSUMIDO
            - DESPERDICIADO
          default: EN_NEVERA

    PatronPredictivoInput:
      type: object
      properties:
        _id:
          type: string
          description: Código personalizado del patrón (Ej. PAT-01)
        user_nombre:
          type: string
          description: Nombre del usuario evaluado (FK)
        frecuencia_compra_dias:
          type: number
          description: Frecuencia estimada de compra en días
        probabilidad_desperdicio:
          type: number
          description: Índice de probabilidad de desperdicio

    MealPrepInput:
      type: object
      properties:
        patron_predictivo_id:
          type: string
          description: Código del patrón predictivo (Ej. PAT-01)
        ingrediente_nombre:
          type: string
          description: Nombre del ingrediente base (FK)
        nombre_receta:
          type: string