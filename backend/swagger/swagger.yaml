openapi: '3.0.0'
info:
  title: Nevera Inteligente API
  description: |
    API RESTful con arquitectura jerárquica, validaciones en tiempo real, restricciones de integridad y respuestas unificadas.

    **Integridad referencial**
    - **Validación de IDs:** si el ID de ruta o una referencia del body o de la query no existe, la API devuelve HTTP `200` con `success: false`.
    - **Restricción al eliminar (409):** un recurso no puede eliminarse mientras otros registros lo referencien. La API responde `409` con el mensaje *"No se puede eliminar el registro porque está siendo utilizado en otros registros del sistema"* e indica en `data.dependencias` qué colecciones lo usan.
    - El historial de inventario es una bitácora y no bloquea eliminaciones.
    - **Validación en vivo:** al pulsar *Try it out*, los campos de ID (ruta, query y campos foráneos del body) se validan mientras se escriben o al salir del campo, sin presionar *Execute* (✅ / ❌ bajo el campo).
    **Autenticación:** usa `POST /api/usuarios/login` y pega `data.token` en **Authorize**. Cada cuenta admite una sesión activa. Tras 7 minutos sin actividad, la sesión vence y la cuenta queda disponible para un nuevo inicio de sesión. La aplicación web registra las interacciones del usuario. Con Bearer, una solicitud autenticada cuenta como actividad y el token tiene una vigencia máxima de 24 horas. Las rutas privadas solo muestran los datos de la sesión. La lectura de catálogos es pública y las escrituras requieren un administrador configurado en `CATALOG_ADMIN_IDS`.

    **Inventario:** se acumulan los lotes del mismo producto si coinciden el usuario, la nevera, la unidad, el estado, el vencimiento y el ingrediente opcional. Si una edición hace que el lote coincida con otro, la API responde `409` e indica el lote existente. Si omites la nevera al crear, se usa NEVERA-01. Los avisos de lotes en nevera que vencen en las próximas 72 horas se generan al guardar el lote y también se revisan al iniciar el servidor y cada hora mientras está activo.
  version: '1.4.0'
servers:
  - url: /
    description: Servidor desde el que se abrió Swagger
  - url: https://nevera-inteligente-api.onrender.com
    description: Servidor de producción en Render (Nube)
  - url: http://localhost:3000
    description: Servidor local de desarrollo

paths:
  /api/salud:
    get:
      tags: [Salud]
      operationId: checkHealth
      summary: Comprobar la disponibilidad de la API y de MongoDB
      description: Comprobación pública para el monitoreo del servicio.
      responses:
        "200":
          description: La API y la base de datos están disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: API y base de datos disponibles
                data: null
        "503":
          description: La base de datos aún no está lista o no respondió a la comprobación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: Base de datos no disponible
                data: null

  # ==========================================
  # 1. MÓDULO DE USUARIOS
  # ==========================================
  /api/usuarios/login:
    post:
      tags: [Usuarios]
      operationId: loginUser
      summary: Iniciar sesión web u obtener un token Bearer
      description: Envía el nombre de usuario o su ID. Copia data.token y pégalo en el botón Authorize de Swagger. Cada cuenta admite una sesión activa que vence tras 7 minutos sin actividad. Cinco fallos en una ventana de cinco minutos inician una espera de cinco minutos completos desde el quinto fallo. Al terminar la espera hay un último intento. Si falla, el ingreso requiere restablecer la contraseña por correo. Se puede solicitar la recuperación desde el inicio de la espera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              anyOf:
                - required: [nombre]
                - required: [id]
              properties:
                nombre:
                  type: string
                  example: John Javier
                id:
                  type: string
                  example: '1001'
                password:
                  type: string
                  format: password
                  example: Ejemplo2026!Jj
                sesion_web:
                  type: boolean
                  default: false
                  description: Si es true, devuelve el perfil y establece una cookie HttpOnly del mismo origen. Swagger usa Bearer por defecto, con una vigencia máxima de 24 horas y un límite de 7 minutos de inactividad.
      responses:
        "200":
          description: Sesión iniciada. El campo data.vence indica la vigencia máxima actual. El campo data.inactividad_restante_ms indica cuánto tiempo queda para que expire la sesión sin actividad adicional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Sesión iniciada
                data:
                  token: token-de-sesion
                  vence: '2026-11-20T12:00:00Z'
                  inactividad_restante_ms: 419998
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: La cuenta ya tiene una sesión activa. Ciérrala para iniciar otra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "423":
          description: La cuenta requiere recuperar la contraseña por correo antes de iniciar sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "429":
          description: La cuenta está en espera o ya hay verificaciones en curso. Retry-After indica el tiempo restante. En la espera de cinco minutos, data.ultimo_intento indica que queda un solo intento.
          headers:
            Retry-After:
              description: Segundos antes de intentar nuevamente.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/usuarios/recuperar-contrasena:
    post:
      tags: [Usuarios]
      operationId: requestPasswordReset
      summary: Solicitar un enlace y un código de recuperación por correo
      description: Si el correo está registrado, se envían un enlace y un código de seis dígitos que vencen en 30 minutos. Completar el cambio por cualquiera de los dos invalida ambos y desbloquea la cuenta. Se puede solicitar un nuevo correo cada dos minutos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@example.com
      responses:
        "202":
          description: Solicitud recibida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "503":
          description: Recuperación por correo sin configurar

  /api/usuarios/restablecer-contrasena:
    post:
      tags: [Usuarios]
      operationId: resetPassword
      summary: Guardar la contraseña nueva mediante el enlace o el código de recuperación
      description: Envía el token del enlace o el correo con el código de seis dígitos como texto. Cada código admite cinco intentos. El enlace del correo también permite completar la recuperación si se agotan los intentos del código.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              oneOf:
                - required: [token]
                  not:
                    required: [codigo]
                - required: [email, codigo]
                  not:
                    required: [token]
              properties:
                token:
                  type: string
                  minLength: 64
                  maxLength: 64
                  pattern: '^[a-f0-9]{64}$'
                email:
                  type: string
                  format: email
                  example: usuario@example.com
                codigo:
                  type: string
                  pattern: '^[0-9]{6}$'
                  example: '012345'
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 1024
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "400":
          $ref: '#/components/responses/BadRequest'
        "503":
          description: Recuperación por código sin configurar

  /api/usuarios:
    post:
      tags: [Usuarios]
      operationId: createUser
      summary: Crear un nuevo usuario (Valida unicidad, ID numérico y contraseña segura)
      description: Si omites el ID, la API asigna uno automáticamente. Los IDs de administrador se reservan para cuentas configuradas. Si el ID enviado pertenece a una cuenta eliminada o quedó en su historial, devuelve HTTP 200 con `success: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          description: El ID solicitado está reservado para una cuenta administradora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "500":
          $ref: '#/components/responses/InternalError'
    get:
      security:
        - bearerAuth: []
      tags: [Usuarios]
      operationId: listUsers
      summary: Consultar el perfil de la sesión en formato de lista
      parameters:
        - name: busqueda
          in: query
          required: false
          schema:
            type: string
            example: John Javier
          description: Texto para filtrar usuarios por ID, nombre o correo (devuelve aviso si no hay coincidencias)
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/usuarios/me:
    get:
      security:
        - bearerAuth: []
        - sessionCookie: []
      tags: [Usuarios]
      operationId: currentUser
      summary: Consultar el perfil de la sesión y el permiso de administrar catálogos
      description: Con cookie, esta consulta conserva el plazo de inactividad vigente. Con Bearer, la solicitud autenticada registra actividad.
      responses:
        "200":
          description: Perfil obtenido con el tiempo restante antes de que expire la sesión.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      inactividad_restante_ms: { type: integer, minimum: 0, maximum: 420000 }
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/usuarios/actividad:
    post:
      security:
        - bearerAuth: []
        - sessionCookie: []
      tags: [Usuarios]
      operationId: recordSessionActivity
      summary: Registrar una interacción de la sesión activa
      description: La aplicación web llama a esta operación al detectar una interacción para renovar el plazo de 7 minutos. La cookie requiere una solicitud del mismo origen. Una sesión vencida requiere un nuevo inicio de sesión.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transcurrido_ms:
                  type: integer
                  minimum: 0
                  maximum: 419999
                  default: 0
                  description: Milisegundos desde la última interacción.
      responses:
        "200":
          description: Actividad registrada y tiempo restante de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Actividad registrada
                data:
                  inactividad_restante_ms: 419997
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/usuarios/logout:
    post:
      security:
        - bearerAuth: []
      tags: [Usuarios]
      operationId: logoutUser
      summary: Revocar la sesión actual
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/UsuarioIdPath'
    get:
      security:
        - bearerAuth: []
      tags: [Usuarios]
      operationId: getUserById
      summary: Consultar un usuario individual por su ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    put:
      security:
        - bearerAuth: []
      tags: [Usuarios]
      operationId: updateUser
      summary: Actualizar un usuario (Nombre, correo o contraseña con validación de seguridad)
      description: Confirma la contraseña actual al cambiar el correo o la contraseña, tanto con token Bearer como con la sesión web.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdate'
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: La cuenta no corresponde a la sesión o falta una contraseña actual válida para el cambio solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        "423":
          description: Si la cuenta agotó sus intentos de inicio de sesión, el cambio de contraseña requiere la recuperación por correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      security:
        - bearerAuth: []
      tags: [Usuarios]
      operationId: deleteUser
      summary: Eliminar un usuario (Bloqueado si tiene inventario, patrones predictivos o notificaciones)
      description: Cuando la cuenta se puede eliminar, se cierran sus sesiones, su ID queda reservado y se conserva el historial de inventario.
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # ==========================================
  # 2. MÓDULO DE CATEGORÍAS
  # ==========================================
  /api/categorias:
    post:
      security:
        - bearerAuth: []
      tags: [Categorías]
      operationId: createCategory
      summary: Crear una nueva categoría de alimentos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaInput'
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'
    get:
      tags: [Categorías]
      operationId: listCategories
      summary: Listar categorías
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/categorias/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoriaIdPath'
    get:
      tags: [Categorías]
      operationId: getCategoryById
      summary: Consultar categoría individual por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - bearerAuth: []
      tags: [Categorías]
      operationId: deleteCategory
      summary: Eliminar categoría (Bloqueada si tiene productos asociados)
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'

  # ==========================================
  # 3. MÓDULO DE MARCAS
  # ==========================================
  /api/marcas:
    post:
      security:
        - bearerAuth: []
      tags: [Marcas]
      operationId: createBrand
      summary: Crear una nueva marca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaInput'
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'
    get:
      tags: [Marcas]
      operationId: listBrands
      summary: Listar marcas
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/marcas/{id}:
    parameters:
      - $ref: '#/components/parameters/MarcaIdPath'
    get:
      tags: [Marcas]
      operationId: getBrandById
      summary: Consultar marca individual por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - bearerAuth: []
      tags: [Marcas]
      operationId: deleteBrand
      summary: Eliminar marca (Bloqueada si tiene productos asociados)
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'

  # ==========================================
  # 4. MÓDULO DE UNIDADES DE MEDIDA
  # ==========================================
  /api/unidades_medida:
    post:
      security:
        - bearerAuth: []
      tags: [Unidades de Medida]
      operationId: createUnit
      summary: Crear una nueva unidad de medida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadMedidaInput'
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'
    get:
      tags: [Unidades de Medida]
      operationId: listUnits
      summary: Listar unidades de medida
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/unidades_medida/{id}:
    parameters:
      - $ref: '#/components/parameters/UnidadMedidaIdPath'
    get:
      tags: [Unidades de Medida]
      operationId: getUnitById
      summary: Consultar unidad de medida individual por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - bearerAuth: []
      tags: [Unidades de Medida]
      operationId: deleteUnit
      summary: Eliminar unidad (Bloqueada si está en uso en el inventario)
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'

  # ==========================================
  # 5. MÓDULO DE INGREDIENTES
  # ==========================================
  /api/ingredientes:
    post:
      security:
        - bearerAuth: []
      tags: [Ingredientes]
      operationId: createIngredient
      summary: Crear un nuevo ingrediente base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredienteInput'
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'
    get:
      tags: [Ingredientes]
      operationId: listIngredients
      summary: Listar ingredientes
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/ingredientes/{id}:
    parameters:
      - $ref: '#/components/parameters/IngredienteIdPath'
    get:
      tags: [Ingredientes]
      operationId: getIngredientById
      summary: Consultar ingrediente individual por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - bearerAuth: []
      tags: [Ingredientes]
      operationId: deleteIngredient
      summary: Eliminar ingrediente (Bloqueado si está en un Meal Prep)
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'

  # ==========================================
  # 6. MÓDULO DE PRODUCTOS
  # ==========================================
  /api/productos:
    post:
      security:
        - bearerAuth: []
      tags: [Productos]
      operationId: createProduct
      summary: Crear un nuevo producto comercial (Valida en tiempo real marca y categoría)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'
    get:
      tags: [Productos]
      operationId: listProducts
      summary: Listar productos con detalle de marca y categoría
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/productos/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductoIdPath'
    get:
      tags: [Productos]
      operationId: getProductById
      summary: Consultar producto individual por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      security:
        - bearerAuth: []
      tags: [Productos]
      operationId: deleteProduct
      summary: Eliminar producto (Bloqueado si está en el inventario)
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/CatalogAdminRequired'

  # ==========================================
  # 7. MÓDULO DE INVENTARIO
  # ==========================================
  /api/inventario:
    post:
      security:
        - bearerAuth: []
      tags: [Inventario]
      operationId: addInventoryItem
      summary: Agregar alimento a la nevera o acumular cantidad (Valida usuario, producto y unidad)
      description: La respuesta incluye la versión del lote. Un lote nuevo comienza en 0 y cada acumulación incrementa su versión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioInput'
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    get:
      security:
        - bearerAuth: []
      tags: [Inventario]
      operationId: listInventoryItems
      summary: Listar los lotes de inventario del usuario
      parameters:
        - $ref: '#/components/parameters/UsuarioIdQuery'
        - name: busqueda
          in: query
          schema: { type: string, maxLength: 100 }
          description: Busca por nombre o ID del producto.
        - name: nevera_id
          in: query
          required: false
          schema:
            type: string
            example: NEVERA-01
        - name: estado
          in: query
          schema:
            type: string
            enum: [EN_NEVERA, CONSUMIDO, DESPERDICIADO]
        - name: vence_desde
          in: query
          schema: { type: string, format: date-time }
          description: Inicio incluido del rango de vencimiento. Envía una fecha y hora con zona horaria.
          example: '2026-12-01T00:00:00-05:00'
        - name: vence_hasta
          in: query
          schema: { type: string, format: date-time }
          description: Fin incluido del rango de vencimiento. Debe ser igual o posterior a vence_desde.
          example: '2026-12-31T23:59:59.999-05:00'
        - name: orden
          in: query
          schema: { type: string, enum: [vencimiento] }
          description: Orden ascendente por vencimiento, con los lotes sin fecha al final.
        - $ref: '#/components/parameters/PaginaQuery'
        - $ref: '#/components/parameters/LimiteQuery'
      responses:
        "200":
          description: Lista de lotes. Incluye `paginacion` cuando se envía `pagina` o `limite`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: object }
                      paginacion:
                        type: object
                        required: [pagina, limite, hay_siguiente]
                        properties:
                          pagina: { type: integer, minimum: 1 }
                          limite: { type: integer, minimum: 1, maximum: 100 }
                          hay_siguiente: { type: boolean }
              example:
                success: true
                message: Lista de inventario obtenida
                data:
                  - _id: 6650a1b2c3d4e5f6a7b8c9d0
                    user_nombre: '1001'
                    nevera_id: NEVERA-01
                    producto_id: PROD-001
                    ingrediente_nombre: Leche
                    unidad_medida_nombre: Litro
                    cantidad: 2
                    fecha_vencimiento: '2026-12-31T00:00:00.000Z'
                    estado: EN_NEVERA
                    version: 0
                paginacion:
                  pagina: 1
                  limite: 25
                  hay_siguiente: false
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "400":
          $ref: '#/components/responses/BadRequest'

  /api/inventario/{itemId}:
    parameters:
      - $ref: '#/components/parameters/InventarioIdPath'
    get:
      security:
        - bearerAuth: []
      tags: [Inventario]
      operationId: getInventoryItem
      summary: Consultar detalle de un alimento por ID
      description: El lote incluye su versión actual. Puedes enviarla al editar para detectar cambios concurrentes.
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
    put:
      security:
        - bearerAuth: []
      tags: [Inventario]
      operationId: updateInventoryItem
      summary: Actualizar alimento del inventario (Valida los IDs enviados) y registrar en historial
      description: Envía los campos que quieras editar y, opcionalmente, la versión del lote que consultaste. El cambio se rechaza si la versión quedó desactualizada o si el lote pasaría a coincidir con otro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventarioUpdate'
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: La versión quedó desactualizada o ya existe un lote con los mismos datos. Se devuelve el ID del lote que debes consultar.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [inventario_id]
                        properties:
                          inventario_id:
                            $ref: '#/components/schemas/ObjectId'
                          conflicto:
                            type: string
                            enum: [VERSION]
                            description: Indica que el lote cambió después de la última consulta.
    delete:
      security:
        - bearerAuth: []
      tags: [Inventario]
      operationId: deleteInventoryItem
      summary: Eliminar alimento del inventario y guardar snapshot en historial
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 8. MÓDULO DE HISTORIAL DE INVENTARIO
  # ==========================================
  /api/historial_inventario:
    get:
      security:
        - bearerAuth: []
      tags: [Historial de Inventario]
      operationId: listInventoryHistory
      summary: Listar bitácora de cambios con respaldo (snapshot)
      parameters:
        - $ref: '#/components/parameters/PaginaQuery'
        - $ref: '#/components/parameters/LimiteQuery'
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "400":
          $ref: '#/components/responses/BadRequest'

  /api/historial_inventario/{id}:
    parameters:
      - $ref: '#/components/parameters/HistorialIdPath'
    get:
      security:
        - bearerAuth: []
      tags: [Historial de Inventario]
      operationId: getHistoryById
      summary: Consultar registro individual del historial por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 9. MÓDULO DE PATRONES PREDICTIVOS
  # ==========================================
  /api/patrones_predictivos:
    post:
      security:
        - bearerAuth: []
      tags: [Patrones Predictivos]
      operationId: createPredictivePattern
      summary: Crear un patrón predictivo de consumo (Valida usuario existente)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatronPredictivoInput'
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    get:
      security:
        - bearerAuth: []
      tags: [Patrones Predictivos]
      operationId: getPredictivePatterns
      summary: Obtener patrones predictivos (Filtrable por usuario)
      parameters:
        - $ref: '#/components/parameters/UsuarioIdQuery'
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/patrones_predictivos/{id}:
    parameters:
      - $ref: '#/components/parameters/PatronIdPath'
    get:
      security:
        - bearerAuth: []
      tags: [Patrones Predictivos]
      operationId: getPredictivePatternById
      summary: Consultar patrón predictivo individual por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      security:
        - bearerAuth: []
      tags: [Patrones Predictivos]
      operationId: deletePredictivePattern
      summary: Eliminar patrón predictivo (bloqueado si un plan de comidas lo utiliza)
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 12. VALIDACIÓN DE IDs EN TIEMPO REAL
  # ==========================================
  /api/validaciones/mapa:
    get:
      tags: [Validaciones]
      operationId: getValidationMap
      summary: Mapa de colecciones y campos foráneos validables
      description: Lo usa Swagger UI para saber qué campos validar mientras se escribe.
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/validaciones/{coleccion}/{id}:
    get:
      security:
        - {}
        - bearerAuth: []
      tags: [Validaciones]
      operationId: validateId
      summary: Verificar si un ID existe en una colección (sin ejecutar la operación)
      description: |
        Swagger UI llama a este endpoint automáticamente al escribir o salir de un campo de ID
        (parámetros de ruta, de query y campos foráneos del body). Responde `success:true` si el ID existe.
      parameters:
        - name: coleccion
          in: path
          required: true
          schema:
            type: string
            enum: [usuarios, categorias, marcas, unidades_medida, productos, inventario, historial_inventario, patrones_predictivos, ingredientes, meal_preps, notificaciones]
            example: usuarios
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: '1001'
      responses:
        "200":
          description: Resultado de la validación
          content:
            application/json:
              examples:
                existe:
                  value:
                    success: true
                    message: ID válido - Usuario encontrado
                    data: { existe: true, coleccion: usuarios, recurso: Usuario, id: '1001' }
                noExiste:
                  value:
                    success: false
                    message: 'Error: El ID no existe en la base de datos'
                    data: { existe: false, coleccion: usuarios, recurso: Usuario, id: '9999' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 10. MÓDULO DE PLANES DE COMIDA (MEAL PREPS)
  # ==========================================
  /api/meal_preps:
    post:
      security:
        - bearerAuth: []
      tags: [Planes de Comida (Meal Preps)]
      operationId: createMealPrep
      summary: Crear plan de comida (Valida patrón predictivo, ingrediente y unicidad del patrón)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPrepInput'
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
    get:
      security:
        - bearerAuth: []
      tags: [Planes de Comida (Meal Preps)]
      operationId: listMealPreps
      summary: Listar planes de comida
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/meal_preps/sugerencias:
    get:
      security:
        - bearerAuth: []
      tags: [Planes de Comida (Meal Preps)]
      operationId: listMealPrepSuggestions
      summary: Sugerir planes a partir de ingredientes vinculados a lotes disponibles
      description: Considera lotes propios en nevera, con cantidad positiva y vigentes. Las ideas no crean planes automáticamente.
      responses:
        "200":
          $ref: '#/components/responses/Ok'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/meal_preps/{id}:
    parameters:
      - $ref: '#/components/parameters/MealPrepIdPath'
    get:
      security:
        - bearerAuth: []
      tags: [Planes de Comida (Meal Preps)]
      operationId: getMealPrepById
      summary: Consultar plan de comida individual por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
    put:
      security:
        - bearerAuth: []
      tags: [Planes de Comida (Meal Preps)]
      operationId: updateMealPrep
      summary: Actualizar el nombre, el ingrediente o el patrón de un plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealPrepUpdate'
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      security:
        - bearerAuth: []
      tags: [Planes de Comida (Meal Preps)]
      operationId: deleteMealPrep
      summary: Eliminar plan de comida por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # 11. MÓDULO DE NOTIFICACIONES
  # ==========================================
  /api/notificaciones:
    post:
      security:
        - bearerAuth: []
      tags: [Notificaciones]
      operationId: createNotification
      summary: Crear notificación para un usuario existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificacionInput'
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    get:
      security:
        - bearerAuth: []
      tags: [Notificaciones]
      operationId: listNotifications
      summary: Listar notificaciones de la sesión
      description: Ordena los avisos del más reciente al más antiguo. Los avisos desactualizados se conservan en el historial. La API incluye paginacion cuando se envía pagina o limite.
      parameters:
        - $ref: '#/components/parameters/UsuarioIdQuery'
        - $ref: '#/components/parameters/PaginaQuery'
        - $ref: '#/components/parameters/LimiteQuery'
        - name: tipo
          in: query
          schema: { type: string, enum: [VENCIMIENTO, STOCK_BAJO, SUGERENCIA] }
        - name: lectura
          in: query
          description: Sin leer incluye los avisos vigentes pendientes. Leídas incluye los avisos que el usuario marcó como tales.
          schema: { type: string, enum: [sin_leer, leidas] }
      responses:
        "200":
          description: Notificaciones de la sesión y datos de paginación cuando se solicita.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notificacion'
                      paginacion:
                        type: object
                        properties:
                          pagina: { type: integer }
                          limite: { type: integer }
                          hay_siguiente: { type: boolean }
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/notificaciones/resumen:
    get:
      security:
        - bearerAuth: []
        - sessionCookie: []
      tags: [Notificaciones]
      operationId: summarizeNotifications
      summary: Consultar el contador y la vista previa de notificaciones
      description: Devuelve el número de avisos vigentes sin leer y hasta cinco avisos recientes. Si la revisión enviada coincide con la actual, devuelve el contador y la revisión.
      parameters:
        - name: revision
          in: query
          description: Última revisión recibida por el cliente.
          schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
      responses:
        "200":
          description: Resumen de notificaciones de la sesión.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [revision, sin_leer]
                        properties:
                          revision: { type: integer, minimum: 0 }
                          sin_leer: { type: integer, minimum: 0 }
                          recientes:
                            type: array
                            maxItems: 5
                            items:
                              $ref: '#/components/schemas/Notificacion'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/notificaciones/{id}:
    parameters:
      - $ref: '#/components/parameters/NotificacionIdPath'
    get:
      security:
        - bearerAuth: []
      tags: [Notificaciones]
      operationId: getNotificationById
      summary: Consultar notificación individual por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'
    patch:
      security:
        - bearerAuth: []
      tags: [Notificaciones]
      operationId: updateNotificationReadStatus
      summary: Marcar un aviso como leído o sin leer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leida]
              properties:
                leida:
                  type: boolean
                  example: true
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      security:
        - bearerAuth: []
      tags: [Notificaciones]
      operationId: deleteNotification
      summary: Eliminar notificación por ID
      responses:
        "200":
          $ref: '#/components/responses/OkWithLookup'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "401":
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: nevera_session
  # ------------------------------------------
  # Parámetros de ID reutilizables
  # ------------------------------------------
  parameters:
    PaginaQuery:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Número de página. La paginación se activa al enviar pagina o limite.
    LimiteQuery:
      name: limite
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      description: Número de registros por página.
    UsuarioIdPath:
      name: id
      in: path
      required: true
      description: ID numérico del usuario (colección `usuarios`). Se busca en tiempo real; si no existe devuelve HTTP 200 con `success: false`.
      schema:
        type: string
        pattern: '^\d+$'
        example: '1001'
    UsuarioIdQuery:
      name: user_nombre
      in: query
      required: false
      description: ID del usuario de la sesión. Si se omite, se usa el usuario autenticado.
      schema:
        type: string
        example: '1001'
    CategoriaIdPath:
      name: id
      in: path
      required: true
      description: ID (nombre) de la categoría (colección `categorias`).
      schema:
        type: string
        example: Lacteos
    MarcaIdPath:
      name: id
      in: path
      required: true
      description: ID (nombre) de la marca (colección `marcas`).
      schema:
        type: string
        example: Alpina
    UnidadMedidaIdPath:
      name: id
      in: path
      required: true
      description: ID (nombre) de la unidad de medida (colección `unidades_medida`).
      schema:
        type: string
        example: Litro
    IngredienteIdPath:
      name: id
      in: path
      required: true
      description: ID (nombre) del ingrediente (colección `ingredientes`).
      schema:
        type: string
        example: Leche
    ProductoIdPath:
      name: id
      in: path
      required: true
      description: ID del producto (colección `productos`).
      schema:
        type: string
        example: PROD-001
    PatronIdPath:
      name: id
      in: path
      required: true
      description: ID del patrón predictivo (colección `patrones_predictivos`).
      schema:
        type: string
        example: PATRON-001
    InventarioIdPath:
      name: itemId
      in: path
      required: true
      description: ObjectId de MongoDB del alimento (24 caracteres hexadecimales, colección `inventario`). Un formato inválido también devuelve HTTP 200 con `success: false`.
      schema:
        $ref: '#/components/schemas/ObjectId'
    HistorialIdPath:
      name: id
      in: path
      required: true
      description: ObjectId del registro de historial (colección `historial_inventario`).
      schema:
        $ref: '#/components/schemas/ObjectId'
    MealPrepIdPath:
      name: id
      in: path
      required: true
      description: ObjectId del plan de comida (colección `meal_preps`).
      schema:
        $ref: '#/components/schemas/ObjectId'
    NotificacionIdPath:
      name: id
      in: path
      required: true
      description: ObjectId de la notificación (colección `notificaciones`).
      schema:
        $ref: '#/components/schemas/ObjectId'

  # ------------------------------------------
  # Respuestas reutilizables
  # ------------------------------------------
  responses:
    Ok:
      description: Operación procesada. Revise `success` y `message` para el resultado (las validaciones de negocio responden con `success:false`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    OkWithLookup:
      description: Si el ID solicitado o referenciado no existe, devuelve `success: false` con el detalle del ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          examples:
            encontrado:
              summary: Operación completada
              value:
                success: true
                message: Operación procesada exitosamente
            idDeRuta:
              summary: El recurso solicitado no existe
              value:
                success: false
                message: El recurso con el ID proporcionado no fue encontrado
                data:
                  recurso: Marca
                  id: NoExiste
            idForaneo:
              summary: Un ID de otra colección enviado no existe
              value:
                success: false
                message: El recurso con el ID proporcionado no fue encontrado
                data:
                  campo: user_nombre
                  valor: '9999'
                  recurso: Usuario
    Unauthorized:
      description: Credenciales inválidas o token ausente, vencido o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: El usuario solicitado no corresponde a la sesión.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    CatalogAdminRequired:
      description: Solo los administradores pueden modificar el catálogo compartido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    BadRequest:
      description: La solicitud contiene JSON inválido o algún parámetro no admitido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    InternalError:
      description: Un fallo interno impidió procesar la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: El recurso está referenciado por otros registros y no puede eliminarse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorConflict'
          example:
            success: false
            message: No se puede eliminar el registro porque está siendo utilizado en otros registros del sistema
            data:
              recurso: Marca
              id: Alpina
              dependencias:
                - coleccion: productos
                  campo: marca_nombre
                  registros: 3

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 6650a1b2c3d4e5f6a7b8c9d0

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          description: Documento, lista o detalle del resultado. Puede ser nulo.

    ErrorConflict:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: No se puede eliminar el registro porque está siendo utilizado en otros registros del sistema
        data:
          type: object
          properties:
            recurso:
              type: string
              example: Marca
            id:
              type: string
              example: Alpina
            dependencias:
              type: array
              items:
                type: object
                properties:
                  coleccion:
                    type: string
                    example: productos
                  campo:
                    type: string
                    example: marca_nombre
                  registros:
                    type: integer
                    example: 3

    UsuarioInput:
      type: object
      required: [nombre, email, password]
      properties:
        id:
          type: string
          description: ID numérico opcional. Si se omite, lo genera la API.
          example: '1001'
        nombre:
          type: string
          description: Nombre único
          example: John Javier
        email:
          type: string
          format: email
          example: john.javier@example.com
        password:
          type: string
          format: password
          description: Mínimo 12 caracteres, mayúsculas, minúsculas, números y símbolos
          example: Ejemplo2026!Jj

    UsuarioUpdate:
      type: object
      properties:
        nombre:
          type: string
          example: John Javier
        email:
          type: string
          format: email
          example: john.javier@example.com
        password:
          type: string
          format: password
          description: Mínimo 12 caracteres, mayúsculas, minúsculas, números y símbolos
          example: Ejemplo2026!Jj
        password_actual:
          type: string
          format: password
          maxLength: 1024
          description: Contraseña actual de la cuenta. Obligatoria para cambiar el correo o la contraseña con cualquier tipo de sesión.

    CategoriaInput:
      type: object
      required: [_id]
      properties:
        _id:
          type: string
          example: Lacteos

    MarcaInput:
      type: object
      required: [_id]
      properties:
        _id:
          type: string
          example: Alpina

    UnidadMedidaInput:
      type: object
      required: [_id, abreviatura]
      properties:
        _id:
          type: string
          example: Litro
        abreviatura:
          type: string
          example: L

    IngredienteInput:
      type: object
      required: [_id]
      properties:
        _id:
          type: string
          example: Leche

    ProductoInput:
      type: object
      required: [_id, marca_nombre, categoria_nombre, nombre]
      properties:
        _id:
          type: string
          example: PROD-001
        marca_nombre:
          type: string
          description: "**FK → marcas._id.** Se valida en tiempo real; si la marca no existe devuelve HTTP 200 con `success: false`."
          example: Alpina
        categoria_nombre:
          type: string
          description: "**FK → categorias._id.** Se valida en tiempo real; si la categoría no existe devuelve HTTP 200 con `success: false`."
          example: Lacteos
        nombre:
          type: string
          example: Leche entera 1L

    InventarioInput:
      type: object
      required: [producto_id, unidad_medida_nombre, cantidad]
      properties:
        user_nombre:
          type: string
          description: Si se envía, debe coincidir con el ID del usuario de la sesión.
          example: '1001'
        nevera_id:
          type: string
          default: NEVERA-01
          example: NEVERA-01
        producto_id:
          type: string
          description: "**FK → productos._id.** Se valida en tiempo real; si el producto no existe devuelve HTTP 200 con `success: false`."
          example: PROD-001
        ingrediente_nombre:
          type: string
          nullable: true
          description: ID opcional de un ingrediente para generar sugerencias.
          example: Leche
        unidad_medida_nombre:
          type: string
          description: "**FK → unidades_medida._id.** Se valida en tiempo real; si la unidad no existe devuelve HTTP 200 con `success: false`."
          example: Litro
        cantidad:
          type: number
          minimum: 0
          example: 2
        fecha_vencimiento:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora con zona horaria. Al agregar un lote, debe ser de hoy en adelante según la hora de Colombia. Usa null para un lote sin vencimiento.
          example: '2026-12-31T00:00:00.000Z'
        estado:
          type: string
          enum: [EN_NEVERA, CONSUMIDO, DESPERDICIADO]
          default: EN_NEVERA

    InventarioUpdate:
      type: object
      minProperties: 1
      description: Envía al menos un campo editable. Los IDs foráneos enviados se validan en tiempo real (HTTP 200 con `success: false` si no existen).
      properties:
        version:
          type: integer
          minimum: 0
          description: Versión opcional obtenida al consultar el lote. Si ya cambió, se devuelve HTTP 409.
          example: 0
        user_nombre:
          type: string
          description: Si se envía, debe coincidir con el ID del usuario de la sesión.
          example: '1001'
        nevera_id:
          type: string
          example: NEVERA-01
        producto_id:
          type: string
          description: "**FK → productos._id.** HTTP 200 con `success: false` si no existe."
          example: PROD-001
        ingrediente_nombre:
          type: string
          nullable: true
          description: Asigna un ingrediente para sugerencias o usa null para quitarlo.
          example: Leche
        unidad_medida_nombre:
          type: string
          description: "**FK → unidades_medida._id.** HTTP 200 con `success: false` si no existe."
          example: Litro
        cantidad:
          type: number
          minimum: 0
          example: 3
        fecha_vencimiento:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora válidas con zona horaria. Usa null para quitar el vencimiento.
          example: '2026-12-31T00:00:00.000Z'
        estado:
          type: string
          enum: [EN_NEVERA, CONSUMIDO, DESPERDICIADO]

    PatronPredictivoInput:
      type: object
      required: [_id]
      properties:
        _id:
          type: string
          example: PATRON-001
        user_nombre:
          type: string
          description: Si se envía, debe coincidir con el ID del usuario de la sesión.
          example: '1001'
        frecuencia_compra_dias:
          type: integer
          minimum: 1
          example: 7
        probabilidad_desperdicio:
          type: number
          minimum: 0
          maximum: 1
          example: 0.25

    MealPrepInput:
      allOf:
        - $ref: '#/components/schemas/MealPrepUpdate'
        - type: object
          required: [ingrediente_nombre, nombre_receta]
          oneOf:
            - required: [patron_predictivo_id]
            - required: [patron]

    MealPrepUpdate:
      type: object
      properties:
        patron_predictivo_id:
          type: string
          description: "**FK → patrones_predictivos._id** (único por plan). Se valida en tiempo real; si no existe devuelve HTTP 200 con `success: false`."
          example: PATRON-001
        ingrediente_nombre:
          type: string
          description: "**FK → ingredientes._id.** Se valida en tiempo real; si no existe devuelve HTTP 200 con `success: false`."
          example: Leche
        nombre_receta:
          type: string
          example: Avena con leche
        patron:
          type: object
          description: Crea un patrón para este plan en la misma operación. Envíalo en lugar de patron_predictivo_id.
          properties:
            frecuencia_compra_dias:
              type: integer
              minimum: 1
              example: 7
            probabilidad_desperdicio:
              type: number
              minimum: 0
              maximum: 1
              example: 0.25

    NotificacionInput:
      type: object
      required: [mensaje]
      properties:
        user_nombre:
          type: string
          description: Si se envía, debe coincidir con el ID del usuario de la sesión.
          example: '1001'
        mensaje:
          type: string
          example: Tu leche vence mañana
        tipo:
          type: string
          enum: [VENCIMIENTO, STOCK_BAJO, SUGERENCIA]
          default: SUGERENCIA
        leida:
          type: boolean
          default: false

    Notificacion:
      allOf:
        - $ref: '#/components/schemas/NotificacionInput'
        - type: object
          properties:
            _id: { type: string }
            nevera_id: { type: string }
            inventario_id: { type: string }
            fecha_vencimiento: { type: string, format: date-time }
            fecha: { type: string, format: date-time }
            desactualizada:
              type: boolean
              readOnly: true
              description: Indica que el aviso se conserva como historial después de cambiar o eliminar el lote. Se excluye del contador de avisos vigentes sin leer.
